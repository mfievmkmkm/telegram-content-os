name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt -r shorts_service/requirements.txt
      - run: python -m pytest -q
      - run: python -m compileall -q content_os shorts_service
      - run: python -c "import shorts_service.app_v2; import content_os.main_v2"
